[project]
name = "postmortem-iq"
version = "0.1.0"
description = "Incident Postmortem Knowledge Graph + RAG System"
requires-python = ">=3.11"
authors = [{name = "Afnan"}]
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
